[project]
name = "chhapakhata"
version = "0.1.0"
description = "Print shop management system: orders, production, stock, billing and customer ledger."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2.18,<5.3",
    "djangorestframework>=3.16,<3.19",
    "drf-spectacular>=0.28,<0.31",
    "drf-standardized-errors>=0.15,<0.17",
    "django-filter>=25.1,<27",
    "psycopg[binary]>=3.2,<3.4",
    "django-environ>=0.12,<0.15",
    "argon2-cffi>=23.1",
    "django-axes>=8.0,<9",
    "django-simple-history>=3.8,<3.14",
    "django-q2>=1.7,<1.12",
    "weasyprint>=65",
    "openpyxl>=3.1,<3.2",
    "nepali-datetime>=1.0.8,<1.1",
    "gunicorn>=23",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.13",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs>=3.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "C4", "RUF"]
ignore = [
    "S101",   # asserts are fine in tests
    "RUF012", # Django class attributes (Meta, choices) are intentionally mutable
    "DJ001",  # null=True on CharField is used deliberately for optional unique codes
    "RUF001", # × and – are intentional in user-facing text (sizes, ranges)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]
"**/management/commands/seed_demo.py" = ["S105", "S106", "S311", "E501"]
"**/management/commands/seed_history.py" = ["S105", "S106", "S311", "E501"]
"config/settings/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:nepali_datetime.*"]

[tool.coverage.run]
source = ["apps"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/management/commands/seed_demo.py",
  "*/management/commands/seed_history.py",
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
files = ["apps/*/services.py", "apps/catalog/pricing.py", "apps/core"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
