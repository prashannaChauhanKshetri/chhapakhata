{% load docs %}<!doctype html>
<html lang="en" class="head-{{ shop.print_header|default:'left' }} text-{{ shop.print_text_size|default:'normal' }}">
<head>
<meta charset="utf-8">
<title>{% block title %}{{ shop.name }}{% endblock %}</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("{{ fonts_uri }}/inter-latin-400-normal.woff") format("woff"); }
  @font-face { font-family: "Inter"; font-weight: 500; src: url("{{ fonts_uri }}/inter-latin-500-normal.woff") format("woff"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("{{ fonts_uri }}/inter-latin-600-normal.woff") format("woff"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("{{ fonts_uri }}/inter-latin-700-normal.woff") format("woff"); }
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 400; src: url("{{ fonts_uri }}/noto-sans-devanagari-devanagari-400-normal.woff") format("woff"); }
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 600; src: url("{{ fonts_uri }}/noto-sans-devanagari-devanagari-600-normal.woff") format("woff"); }

  @page {
    size: {% block page_size %}A4{% endblock %};
    margin: {% block page_margin %}14mm 12mm 16mm 12mm{% endblock %};
    {% block page_footer %}
    @bottom-left { content: "{% autoescape off %}{{ shop.name|css_string }}{% endautoescape %}"; font: 8pt "Inter", sans-serif; color: #475569; }
    @bottom-right { content: "Page " counter(page) " of " counter(pages); font: 8pt "Inter", sans-serif; color: #475569; }
    {% endblock %}
  }

  * { box-sizing: border-box; }
  html { font-family: "Inter", "Noto Sans Devanagari", "Helvetica Neue", Arial, sans-serif; color: #0B1220; }
  /* Print-strong palette: dark ink for text, one deep blue accent for headings and bars. */
  body { margin: 0; font-size: 10pt; line-height: 1.45; }
  h1, h2, h3 { margin: 0; color: #0F172A; }
  .muted { color: #334155; }
  .strong { color: #0B1220; font-weight: 700; font-size: 11pt; }
  .right { text-align: right; }
  .center { text-align: center; }
  .nowrap { white-space: nowrap; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Shop header */
  .doc-header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 10pt; border-bottom: 2pt solid {{ accent }}; }
  .brand { display: flex; gap: 10pt; align-items: flex-start; flex: 1; min-width: 0; }
  .brand > div { flex: 1; }
  .brand img { max-height: 46pt; max-width: 90pt; }
  .shop-name { font-size: 17pt; font-weight: 700; letter-spacing: -0.2pt; color: {{ accent }}; }
  .shop-tagline { font-size: 9.5pt; font-weight: 600; color: #1E293B; margin-top: 1pt; }
  .shop-meta { font-size: 9.5pt; color: #0B1220; margin-top: 3pt; line-height: 1.5; }
  .shop-meta .contact b { font-weight: 700; }
  .doc-title { text-align: right; flex: none; padding-left: 12pt; }
  .doc-title h1 { font-size: 15pt; font-weight: 700; letter-spacing: 1.2pt; text-transform: uppercase; color: {{ accent }}; }
  .doc-title .sub { font-size: 9pt; color: #1E293B; margin-top: 2pt; }

  .copy-mark { display: inline-block; margin-top: 4pt; padding: 2pt 6pt; border: 1pt solid #334155; border-radius: 3pt; font-size: 7.5pt; font-weight: 600; letter-spacing: 0.6pt; text-transform: uppercase; }

  /* Info blocks */
  .info { display: flex; gap: 14pt; margin: 12pt 0; }
  .info .block { flex: 1; border: 0.75pt solid #94A3B8; border-radius: 4pt; padding: 7pt 9pt; }
  .label { font-size: 9pt; font-weight: 700; letter-spacing: 0.3pt; color: {{ accent }}; margin-bottom: 3pt; }
  .kv { width: 100%; border-collapse: collapse; }
  .kv td { padding: 1.5pt 0; vertical-align: top; }
  .kv td:first-child { color: #334155; width: 42%; }

  /* Line tables */
  table.lines { width: 100%; border-collapse: collapse; margin-top: 4pt; }
  /* The header row is painted once, so no seams show between its cells. */
  table.lines thead tr { background: {{ accent }}; }
  table.lines th { font-size: 9pt; font-weight: 700; color: #FFFFFF; padding: 6pt 6pt; text-align: left; }
  /* Number columns: the heading lines up with its figures. */
  table.lines th.num, table.lines td.num { text-align: right; }
  table.lines td { padding: 5pt 6pt; border-bottom: 0.75pt solid #CBD5E1; vertical-align: top; }
  table.lines .detail { font-size: 8.5pt; color: #334155; margin-top: 1pt; }
  table.lines tr { page-break-inside: avoid; }
  table.lines td.details { font-size: 8.5pt; color: #1E293B; }
  table.lines td.details .detail { margin-top: 0; }

  /* Totals */
  .totals-wrap { display: flex; justify-content: space-between; gap: 16pt; margin-top: 10pt; page-break-inside: avoid; }
  .words { flex: 1; font-size: 9.5pt; }
  table.totals { width: 46%; border-collapse: collapse; }
  table.totals td { padding: 3pt 6pt; }
  table.totals td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  table.totals tr.grand td { border-top: 1.25pt solid #0B1220; font-size: 11pt; font-weight: 700; padding-top: 5pt; }
  /* The amount to pay: a solid bar, as on the shop's own bills. */
  table.totals tr.due { background: {{ accent }}; }
  table.totals tr.due td { color: #FFFFFF; font-size: 12.5pt; font-weight: 700; padding: 7pt 8pt; }
  table.totals tr.gap td { padding: 3pt 0 0; }
  table.totals tr.soft td { color: #334155; }

  /* Signatures */
  .signatures { display: flex; justify-content: space-between; margin-top: 34pt; page-break-inside: avoid; }
  .sign { width: 40%; text-align: center; position: relative; }
  .sign .line { border-top: 1pt solid #0B1220; padding-top: 3pt; font-size: 9pt; color: #0B1220; }
  .sign .art { height: 46pt; position: relative; }
  .sign .art img.signature { max-height: 40pt; max-width: 120pt; }
  .sign .art img.stamp { position: absolute; left: 50%; top: -6pt; margin-left: -30pt; max-height: 60pt; max-width: 60pt; opacity: 0.85; }

  /* Signatures and the closing note sit at the foot of the last page instead
     of mid-page. The spacer keeps that much room free below the content, so
     the block (placed against the page bottom) never covers a line. */
  .doc-end-space { height: 34mm; break-inside: avoid; }
  .doc-end { position: absolute; left: 0; right: 0; bottom: 0; }
  .doc-end .signatures { margin-top: 0; }

  .footer-note { margin-top: 14pt; font-size: 8.5pt; color: #334155; border-top: 0.75pt solid #CBD5E1; padding-top: 5pt; }

  .watermark { position: fixed; top: 38%; left: 0; right: 0; text-align: center; font-size: 64pt; font-weight: 700; color: rgba(185, 28, 28, 0.13); transform: rotate(-24deg); letter-spacing: 6pt; }

  /* Settings → Print layout */
  html.head-center .doc-header { flex-direction: column; align-items: center; text-align: center; }
  html.head-center .brand { flex-direction: column; align-items: center; gap: 4pt; width: 100%; }
  html.head-center .brand > div { flex: none; width: 100%; }
  html.head-center .doc-header { align-items: stretch; }
  html.head-center .doc-title { text-align: center; margin-top: 8pt; padding-left: 0; }
  html.text-large body { font-size: 11pt; }
  html.text-large .shop-meta, html.text-large .shop-tagline { font-size: 10.5pt; }
  html.text-large table.lines th, html.text-large .label { font-size: 10pt; }
  html.text-large table.lines .detail, html.text-large .footer-note { font-size: 9.5pt; }
  html.text-large .shop-name { font-size: 19pt; }

  .payment-info { margin-top: 8pt; }
  .payment-info .text { white-space: pre-line; font-weight: 600; }

  {% block extra_style %}{% endblock %}
</style>
</head>
<body class="{% block body_class %}{% endblock %}">
{% block content %}{% endblock %}
</body>
</html>
