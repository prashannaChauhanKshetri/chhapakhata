          type: string
        order_number_pattern:
          type: string
          maxLength: 40
        job_number_pattern:
          type: string
          maxLength: 40
        invoice_number_pattern:
          type: string
          maxLength: 40
        receipt_number_pattern:
          type: string
          maxLength: 40
        purchase_number_pattern:
          type: string
          maxLength: 40
