    ShopSettings:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        tagline:
          type: string
          maxLength: 200
        address:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 60
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        pan_vat_number:
          type: string
          title: PAN / VAT number
          maxLength: 20
        is_vat_registered:
          type: boolean
          description: When on, VAT is added to quotations and invoices.
        vat_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        default_min_sqft:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          title: Default minimum sq ft
          description: Any item smaller than this is charged as this many sq ft.
        round_total_to_rupee:
          type: boolean
          description: Round grand totals to the nearest rupee with a round-off line.
        front_desk_max_discount_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Default discount limit for front desk staff (can be overridden
            per user).
        logo:
          type: string
          format: uri
          nullable: true
        stamp_image:
          type: string
          format: uri
          nullable: true
        signature_image:
          type: string
          format: uri
          nullable: true
        invoice_footer_note:
          type: string
          maxLength: 255
        quotation_validity_days:
          type: integer
          maximum: 32767
          minimum: 0
